name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write   # required for the OIDC federated credential used by azure/login

    env:
      SIGNING_ENABLED: ${{ vars.AZURE_SIGNING_ENDPOINT != '' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # --overlay-triplets is required, not optional: triplets/ pins
      # VCPKG_PLATFORM_TOOLSET to v143 to match the PlatformToolset the
      # vcxproj uses. Without it vcpkg silently resolves the built-in triplet
      # of the same name, builds the dependencies with whatever MSVC the
      # runner happens to ship, and the link fails on STL symbols that the
      # v143 import library does not have (e.g. __std_find_last_not_ch_pos_1).
      - name: Install dependencies (x64)
        run: vcpkg install --triplet x64-windows-static-md --overlay-triplets=triplets --x-install-root=vcpkg_installed

      - name: Install dependencies (x86)
        run: vcpkg install --triplet x86-windows-static-md --overlay-triplets=triplets --x-install-root=vcpkg_installed_x86

      - name: Generate version header
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File generate_version.ps1 -Output version_info.h -Version '${{ github.ref_name }}'

      - name: Build Release x64
        run: >
          msbuild LANCommander.Interposer.slnx
          /t:LANCommander_Interposer,LANCommander_Interposer_Injector
          /p:Configuration=Release /p:Platform=x64

      - name: Build Release x86
        run: >
          msbuild LANCommander.Interposer.slnx
          /t:LANCommander_Interposer,LANCommander_Interposer_Injector
          /p:Configuration=Release /p:Platform=x86

      - name: Build Release Proxy x64
        run: >
          msbuild LANCommander.Interposer.slnx
          /t:LANCommander_Interposer
          /p:Configuration="Release Proxy" /p:Platform=x64

      - name: Build Release Proxy x86
        run: >
          msbuild LANCommander.Interposer.slnx
          /t:LANCommander_Interposer
          /p:Configuration="Release Proxy" /p:Platform=x86

      - name: Build Release Proxy DInput8 x64
        run: >
          msbuild LANCommander.Interposer.slnx
          /t:LANCommander_Interposer
          /p:Configuration="Release Proxy DInput8" /p:Platform=x64

      - name: Build Release Proxy DInput8 x86
        run: >
          msbuild LANCommander.Interposer.slnx
          /t:LANCommander_Interposer
          /p:Configuration="Release Proxy DInput8" /p:Platform=x86

      - name: Build Release Proxy DInput x64
        run: >
          msbuild LANCommander.Interposer.slnx
          /t:LANCommander_Interposer
          /p:Configuration="Release Proxy DInput" /p:Platform=x64

      - name: Build Release Proxy DInput x86
        run: >
          msbuild LANCommander.Interposer.slnx
          /t:LANCommander_Interposer
          /p:Configuration="Release Proxy DInput" /p:Platform=x86

      - name: Build Release ASI x64
        run: >
          msbuild LANCommander.Interposer.slnx
          /t:LANCommander_Interposer
          /p:Configuration="Release ASI" /p:Platform=x64

      - name: Build Release ASI x86
        run: >
          msbuild LANCommander.Interposer.slnx
          /t:LANCommander_Interposer
          /p:Configuration="Release ASI" /p:Platform=x86

      - name: Build Plugin CDKey x64
        run: >
          msbuild LANCommander.Interposer.slnx
          /t:LANCommander_Interposer_Plugin_CDKey
          /p:Configuration=Release /p:Platform=x64

      - name: Build Plugin CDKey x86
        run: >
          msbuild LANCommander.Interposer.slnx
          /t:LANCommander_Interposer_Plugin_CDKey
          /p:Configuration=Release /p:Platform=x86

      # ── Authenticode signing (Azure Artifact Signing) ────────────────────────
      #
      # Signs every PE output under Release\ in place, before any packaging step
      # runs. The redistributable payload ZIP and the LCX are both assembled by
      # copying out of Release\ further down, so signing here also covers the
      # copies embedded in those packages. The ZIP and LCX containers themselves
      # are not PE files and cannot be Authenticode signed.
      #
      # Required repository secrets (OIDC federated credential):
      #   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
      #
      # Required repository variables:
      #   AZURE_SIGNING_ENDPOINT           e.g. https://eus.codesigning.azure.net
      #   AZURE_SIGNING_ACCOUNT_NAME
      #   AZURE_SIGNING_CERT_PROFILE_NAME
      #
      # Leaving AZURE_SIGNING_ENDPOINT unset disables signing: every step below is
      # skipped and the job still produces a complete (unsigned) release, so forks
      # without the Azure setup keep working.
      #
      # NOTE: if these secrets and variables are scoped to a GitHub *environment*
      # rather than the repository, they resolve empty here and signing is silently
      # skipped. Add a matching `environment:` key to this job in that case — but be
      # aware that gates the entire release job, not just signing.
      - name: Report signing configuration
        shell: pwsh
        run: |
          if ($env:SIGNING_ENABLED -eq 'true') {
            Write-Host "Signing release binaries"
          } else {
            Write-Host "::warning::AZURE_SIGNING_ENDPOINT is not set. Release binaries will be unsigned."
          }

      - name: Collect Files to Sign
        id: targets
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Every PE the release ships. LANCommander.Interposer.asi is a renamed
          # DLL — signtool dispatches on PE format, not file extension.
          $patterns = @(
            'LANCommander.Interposer.dll'
            'LANCommander.Interposer.Injector.exe'
            'LANCommander.Interposer.Plugin.CDKey.dll'
            'LANCommander.Interposer.asi'
            'version.dll'
            'dinput8.dll'
            'dinput.dll'
          )

          # The signing action expects absolute paths. Each build configuration
          # writes to its own subdirectory (Injector\, Proxy\, ProxyDInput8\,
          # ProxyDInput\, ASI\, CDKey\), so the search has to recurse.
          $files = Get-ChildItem -Path 'Release' -Recurse -File -Include $patterns |
            Select-Object -ExpandProperty FullName |
            Sort-Object -Unique

          if (-not $files) {
            throw "No files under Release\ matched the signing patterns. Refusing to sign nothing."
          }

          Write-Host "Signing $($files.Count) file(s):"
          $files | ForEach-Object { Write-Host "  $($_.Substring($PWD.Path.Length + 1))" }

          # Persist the exact list so the verification step checks what was signed
          # rather than re-deriving it.
          $manifest = Join-Path $env:RUNNER_TEMP 'sign-targets.txt'
          $files | Set-Content -Path $manifest -Encoding UTF8

          "files<<SIGNTARGETS" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $files               | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "SIGNTARGETS"        | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # The signing action documents a .NET 8 runtime prerequisite, which is not
      # guaranteed to be present on every windows-latest image revision.
      - name: Setup .NET
        if: env.SIGNING_ENABLED == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Azure Login
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Files
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_CERT_PROFILE_NAME }}
          files: ${{ steps.targets.outputs.files }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          # Pin authentication to the session established by azure/login rather than
          # letting DefaultAzureCredential fall through a chain of unconfigured options.
          exclude-environment-credential: true
          exclude-azure-cli-credential: false

      - name: Verify Signatures
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $manifest = Join-Path $env:RUNNER_TEMP 'sign-targets.txt'
          $failed = @()

          foreach ($path in Get-Content -Path $manifest) {
            $signature = Get-AuthenticodeSignature -FilePath $path
            $relative = $path.Substring($PWD.Path.Length + 1)

            if ($signature.Status -ne 'Valid') {
              $failed += "$relative : $($signature.Status) - $($signature.StatusMessage)"
            } elseif (-not $signature.TimeStamperCertificate) {
              $failed += "$relative : signed but not timestamped"
            } else {
              Write-Host "$relative : Valid ($($signature.SignerCertificate.Subject))"
            }
          }

          if ($failed) {
            $failed | ForEach-Object { Write-Host "::error::$_" }
            throw "$($failed.Count) file(s) failed signature verification."
          }

      - name: Create release ZIPs
        shell: pwsh
        run: |
          $version   = '${{ github.ref_name }}'
          $sampleDir = 'LANCommander.Interposer\.interposer'

          # Standard (DLL + Injector)
          $d = 'pkg\standard'
          New-Item -ItemType Directory -Force "$d\x64" | Out-Null
          Copy-Item 'Release\Injector\x64\LANCommander.Interposer.dll'            "$d\x64\"
          Copy-Item 'Release\Injector\x64\LANCommander.Interposer.Injector.exe'   "$d\x64\"
          Copy-Item -Recurse $sampleDir "$d\x64\"
          Compress-Archive -Path "$d\x64\*" -DestinationPath "LANCommander.Interposer.$version.x64.zip"

          New-Item -ItemType Directory -Force "$d\x86" | Out-Null
          Copy-Item 'Release\Injector\x86\LANCommander.Interposer.dll'            "$d\x86\"
          Copy-Item 'Release\Injector\x86\LANCommander.Interposer.Injector.exe'   "$d\x86\"
          Copy-Item -Recurse $sampleDir "$d\x86\"
          Compress-Archive -Path "$d\x86\*" -DestinationPath "LANCommander.Interposer.$version.x86.zip"

          # Proxy (version.dll)
          $d = 'pkg\proxy'
          New-Item -ItemType Directory -Force "$d\x64" | Out-Null
          Copy-Item 'Release\Proxy\x64\version.dll' "$d\x64\"
          Copy-Item -Recurse $sampleDir "$d\x64\"
          Compress-Archive -Path "$d\x64\*" -DestinationPath "LANCommander.Interposer.Proxy.$version.x64.zip"

          New-Item -ItemType Directory -Force "$d\x86" | Out-Null
          Copy-Item 'Release\Proxy\x86\version.dll' "$d\x86\"
          Copy-Item -Recurse $sampleDir "$d\x86\"
          Compress-Archive -Path "$d\x86\*" -DestinationPath "LANCommander.Interposer.Proxy.$version.x86.zip"

          # Proxy DInput8 (dinput8.dll)
          $d = 'pkg\proxy-dinput8'
          New-Item -ItemType Directory -Force "$d\x64" | Out-Null
          Copy-Item 'Release\ProxyDInput8\x64\dinput8.dll' "$d\x64\"
          Copy-Item -Recurse $sampleDir "$d\x64\"
          Compress-Archive -Path "$d\x64\*" -DestinationPath "LANCommander.Interposer.Proxy.DInput8.$version.x64.zip"

          New-Item -ItemType Directory -Force "$d\x86" | Out-Null
          Copy-Item 'Release\ProxyDInput8\x86\dinput8.dll' "$d\x86\"
          Copy-Item -Recurse $sampleDir "$d\x86\"
          Compress-Archive -Path "$d\x86\*" -DestinationPath "LANCommander.Interposer.Proxy.DInput8.$version.x86.zip"

          # Proxy DInput (dinput.dll)
          $d = 'pkg\proxy-dinput'
          New-Item -ItemType Directory -Force "$d\x64" | Out-Null
          Copy-Item 'Release\ProxyDInput\x64\dinput.dll' "$d\x64\"
          Copy-Item -Recurse $sampleDir "$d\x64\"
          Compress-Archive -Path "$d\x64\*" -DestinationPath "LANCommander.Interposer.Proxy.DInput.$version.x64.zip"

          New-Item -ItemType Directory -Force "$d\x86" | Out-Null
          Copy-Item 'Release\ProxyDInput\x86\dinput.dll' "$d\x86\"
          Copy-Item -Recurse $sampleDir "$d\x86\"
          Compress-Archive -Path "$d\x86\*" -DestinationPath "LANCommander.Interposer.Proxy.DInput.$version.x86.zip"

          # ASI
          $d = 'pkg\asi'
          New-Item -ItemType Directory -Force "$d\x64" | Out-Null
          Copy-Item 'Release\ASI\x64\LANCommander.Interposer.asi' "$d\x64\"
          Copy-Item -Recurse $sampleDir "$d\x64\"
          Compress-Archive -Path "$d\x64\*" -DestinationPath "LANCommander.Interposer.ASI.$version.x64.zip"

          New-Item -ItemType Directory -Force "$d\x86" | Out-Null
          Copy-Item 'Release\ASI\x86\LANCommander.Interposer.asi' "$d\x86\"
          Copy-Item -Recurse $sampleDir "$d\x86\"
          Compress-Archive -Path "$d\x86\*" -DestinationPath "LANCommander.Interposer.ASI.$version.x86.zip"

      - name: Create redistributable payload ZIP
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'

          # Single payload carrying every load method for both architectures.
          # The redistributable's install script picks one based on the
          # Loader.Method / Loader.Architecture options and renders
          # .interposer\Config.yml itself, so no sample config is included.
          $d = 'pkg\redistributable'

          foreach ($arch in @('x64', 'x86')) {
            New-Item -ItemType Directory -Force "$d\$arch" | Out-Null
            Copy-Item "Release\Proxy\$arch\version.dll"                      "$d\$arch\"
            Copy-Item "Release\ProxyDInput8\$arch\dinput8.dll"               "$d\$arch\"
            Copy-Item "Release\ProxyDInput\$arch\dinput.dll"                 "$d\$arch\"
            Copy-Item "Release\ASI\$arch\LANCommander.Interposer.asi"        "$d\$arch\"
          }

          Compress-Archive -Path "$d\*" -DestinationPath "LANCommander.Interposer.Redistributable.$version.zip"

      - name: Create Plugin CDKey ZIPs
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'

          $d = 'pkg\cdkey\x64'
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item 'Release\CDKey\x64\LANCommander.Interposer.Plugin.CDKey.dll' "$d\"
          Compress-Archive -Path "$d\*" -DestinationPath "LANCommander.Interposer.Plugin.CDKey.$version.x64.zip"

          $d = 'pkg\cdkey\x86'
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item 'Release\CDKey\x86\LANCommander.Interposer.Plugin.CDKey.dll' "$d\"
          Compress-Archive -Path "$d\*" -DestinationPath "LANCommander.Interposer.Plugin.CDKey.$version.x86.zip"

      - name: Create LCX package
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $version   = '${{ github.ref_name }}'
          $buildDate = (Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')
          $redistDir = 'LANCommander.Interposer.Redistributable'
          $zipPath   = "LANCommander.Interposer.Redistributable.$version.zip"
          $outPath   = "LANCommander.Interposer.$version.lcx"

          $archiveGuid   = [guid]::NewGuid().ToString()
          $objectKeyGuid = [guid]::NewGuid().ToString()

          # Measure sizes
          $compressedSize   = (Get-Item $zipPath).Length
          $uncompressedSize = 0
          $zf = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath).Path)
          foreach ($e in $zf.Entries) { $uncompressedSize += $e.Length }
          $zf.Dispose()

          # Substitute variables in Manifest.yml
          $manifest = (Get-Content "$redistDir\Manifest.yml" -Raw) `
            -replace '\{BuildDate\}',       $buildDate `
            -replace '\{ArchiveGUID\}',      $archiveGuid `
            -replace '\{ObjectKeyGUID\}',    $objectKeyGuid `
            -replace '\{VersionTag\}',       $version `
            -replace '\{CompressedSize\}',   $compressedSize `
            -replace '\{UncompressedSize\}', $uncompressedSize

          # LANCommander's importer looks up Archives/<Archive.Id> and
          # Scripts/<Script.Id> -- bare GUIDs, no file extension. Anything else
          # imports as an empty script or a missing archive.
          $tmp = 'lcx_tmp'
          New-Item -ItemType Directory -Force "$tmp\Archives" | Out-Null
          New-Item -ItemType Directory -Force "$tmp\Scripts"  | Out-Null

          Set-Content "$tmp\Manifest.yml" $manifest -Encoding UTF8NoBOM

          $scripts = Get-ChildItem "$redistDir\Scripts" -Filter '*.ps1'
          $scripts | ForEach-Object { Copy-Item $_.FullName "$tmp\Scripts\$($_.BaseName)" }

          Copy-Item $zipPath "$tmp\Archives\$archiveGuid"

          Compress-Archive -Path "$tmp\*" -DestinationPath $outPath
          Remove-Item -Recurse -Force $tmp

          # Guard against the layout drifting again
          $expected = @('Manifest.yml', "Archives/$archiveGuid") + ($scripts | ForEach-Object { "Scripts/$($_.BaseName)" })
          $zf = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $outPath).Path)
          $names = @($zf.Entries | ForEach-Object { $_.FullName })
          $zf.Dispose()

          $missing = $expected | Where-Object { $names -notcontains $_ }
          if ($missing) { throw "LCX is missing expected entries: $($missing -join ', ')" }

          Write-Host "LCX entries: $($names -join ', ')"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            LANCommander.Interposer*.zip
            LANCommander.Interposer*.lcx
