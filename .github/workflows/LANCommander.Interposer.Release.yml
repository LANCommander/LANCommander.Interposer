name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    # Load-bearing for code signing, not bookkeeping. The Azure federated
    # credential is registered against the subject
    #
    #   repo:LANCommander@144402227/LANCommander.Interposer@1181985472:environment:release
    #
    # and the ":environment:release" tail only appears in the OIDC token's
    # subject claim when the job declares an environment. Without this key the
    # token's subject is ref-scoped instead, Entra rejects it as no matching
    # federated identity credential, and azure/login fails.
    #
    # It also gates the whole job: any protection rules on the `release`
    # environment (required reviewers, wait timer, branch/tag restrictions)
    # apply to the entire release, not just the signing steps.
    environment: release

    permissions:
      contents: write
      id-token: write   # required for the OIDC federated credential used by azure/login

    env:
      SIGNING_ENABLED: ${{ vars.AZURE_SIGNING_ENDPOINT != '' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The presets take vcpkg from VCPKG_ROOT; the runner image ships a clone
      # under VCPKG_INSTALLATION_ROOT. Dependencies install at configure time,
      # into each preset's own build tree, with --overlay-triplets supplied by
      # the presets: triplets/ pins VCPKG_PLATFORM_TOOLSET to v143 to match the
      # toolset CMake is told to use. Without the overlay vcpkg silently
      # resolves the built-in triplet of the same name, builds the dependencies
      # with whatever MSVC the runner happens to ship, and the link fails on STL
      # symbols that the v143 import library does not have (e.g.
      # __std_find_last_not_ch_pos_1).
      - name: Locate vcpkg
        shell: pwsh
        run: '"VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append'

      # YY-Thunks is a build-time dependency of every shipping binary: it is what
      # lets the v143 CRT load on Windows XP (see build/Compatibility.cmake).
      # Pinned to a version and SHA-256 inside the script.
      - name: Fetch YY-Thunks
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build/Get-YYThunks.ps1

      # Only what ships: the test EXE and Plugin.Example are left out.
      - name: Build Release x64
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --preset windows-x64 '-DINTERPOSER_VERSION=${{ github.ref_name }}'
          cmake --build --preset windows-x64-release --target LANCommander.Interposer LANCommander.Interposer.Injector LANCommander.Interposer.Plugin.CDKey LANCommander.Interposer.Plugin.Mouse

      - name: Build Release x86
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --preset windows-x86 '-DINTERPOSER_VERSION=${{ github.ref_name }}'
          cmake --build --preset windows-x86-release --target LANCommander.Interposer LANCommander.Interposer.Injector LANCommander.Interposer.Plugin.CDKey LANCommander.Interposer.Plugin.Mouse

      # Every shipping binary must load on Windows XP with nothing installed:
      # no CRT DLLs, subsystem 5.01/5.02, and no import XP does not export.
      # Checked against XP's real export tables, so a dependency that pulls in
      # a Vista+ API fails the release here instead of on a player's machine.
      - name: Verify Windows XP compatibility
        shell: pwsh
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass -File build/Test-XPImports.ps1
          'out\windows-*\bin\Release\*.dll' 'out\windows-*\bin\Release\LANCommander.Interposer.Injector.exe'
          'out\windows-*\bin\Release\Plugins\*.dll'

      # ── Authenticode signing (Azure Artifact Signing) ────────────────────────
      #
      # Signs every PE output under out\windows-*\bin\Release\ in place, before
      # any packaging step runs. The redistributable payload ZIP and the LCX are
      # both assembled by copying out of there further down, so signing here also
      # covers the copies embedded in those packages. The ZIP and LCX containers
      # themselves are not PE files and cannot be Authenticode signed.
      #
      # Required repository secrets (OIDC federated credential):
      #   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
      #
      # Required repository variables:
      #   AZURE_SIGNING_ENDPOINT           e.g. https://eus.codesigning.azure.net
      #   AZURE_SIGNING_ACCOUNT_NAME
      #   AZURE_SIGNING_CERT_PROFILE_NAME
      #
      # Leaving AZURE_SIGNING_ENDPOINT unset disables signing: every step below is
      # skipped and the job still produces a complete (unsigned) release, so forks
      # without the Azure setup keep working.
      #
      # These resolve from the `release` environment as well as the repository,
      # because the job declares that environment (see the top of the job).
      # Environment-scoped values win over repository-scoped ones.
      - name: Report signing configuration
        shell: pwsh
        run: |
          if ($env:SIGNING_ENABLED -eq 'true') {
            Write-Host "Signing release binaries"
          } else {
            Write-Host "::warning::AZURE_SIGNING_ENDPOINT is not set. Release binaries will be unsigned."
          }

      - name: Collect Files to Sign
        id: targets
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Every distinct PE the release ships: the Interposer itself, the
          # injector, and the CD key plugin. One Interposer DLL serves every
          # load method — packaging copies it out under the name each method
          # needs (version.dll, dinput8.dll, dinput.dll, *.asi) — so it is
          # signed once here, before any of those copies are made. Authenticode
          # covers the PE contents, not the file name, so every copy in the
          # archive and in the LCX payload carries the signature.
          $patterns = @(
            'LANCommander.Interposer.dll'
            'LANCommander.Interposer.Injector.exe'
            'LANCommander.Interposer.Plugin.*.dll'
          )

          # The signing action expects absolute paths. Plugins build into a
          # Plugins\ subdirectory, so the search has to recurse. The plugin
          # pattern is a wildcard so a new plugin is signed by existing.
          $files = Get-ChildItem -Path 'out\windows-x64\bin\Release', 'out\windows-x86\bin\Release' -Recurse -File -Include $patterns |
            Select-Object -ExpandProperty FullName |
            Sort-Object -Unique

          if (-not $files) {
            throw "No files under out\windows-*\bin\Release\ matched the signing patterns. Refusing to sign nothing."
          }

          Write-Host "Signing $($files.Count) file(s):"
          $files | ForEach-Object { Write-Host "  $($_.Substring($PWD.Path.Length + 1))" }

          # Persist the exact list so the verification step checks what was signed
          # rather than re-deriving it.
          $manifest = Join-Path $env:RUNNER_TEMP 'sign-targets.txt'
          $files | Set-Content -Path $manifest -Encoding UTF8

          "files<<SIGNTARGETS" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $files               | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "SIGNTARGETS"        | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # The signing action documents a .NET 8 runtime prerequisite, which is not
      # guaranteed to be present on every windows-latest image revision.
      - name: Setup .NET
        if: env.SIGNING_ENABLED == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Azure Login
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Files
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_CERT_PROFILE_NAME }}
          files: ${{ steps.targets.outputs.files }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          # Pin authentication to the session established by azure/login rather than
          # letting DefaultAzureCredential fall through a chain of unconfigured options.
          exclude-environment-credential: true
          exclude-azure-cli-credential: false

      - name: Verify Signatures
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $manifest = Join-Path $env:RUNNER_TEMP 'sign-targets.txt'
          $failed = @()

          foreach ($path in Get-Content -Path $manifest) {
            $signature = Get-AuthenticodeSignature -FilePath $path
            $relative = $path.Substring($PWD.Path.Length + 1)

            if ($signature.Status -ne 'Valid') {
              $failed += "$relative : $($signature.Status) - $($signature.StatusMessage)"
            } elseif (-not $signature.TimeStamperCertificate) {
              $failed += "$relative : signed but not timestamped"
            } else {
              Write-Host "$relative : Valid ($($signature.SignerCertificate.Subject))"
            }
          }

          if ($failed) {
            $failed | ForEach-Object { Write-Host "::error::$_" }
            throw "$($failed.Count) file(s) failed signature verification."
          }

      - name: Create release ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $version   = '${{ github.ref_name }}'
          $sampleDir = 'LANCommander.Interposer\.interposer'
          $d         = 'pkg\release'

          # One archive, one directory per architecture. Every load method is
          # the same signed DLL copied out under the name that method needs, so
          # the user picks a file name rather than a download. Authenticode
          # covers the PE contents, not the file name, so each copy stays
          # signed.
          $loaderNames = @('version.dll', 'dinput8.dll', 'dinput.dll', 'LANCommander.Interposer.asi')

          foreach ($arch in @('x64', 'x86')) {
            $archDir = "$d\$arch"
            New-Item -ItemType Directory -Force $archDir | Out-Null

            $bin = "out\windows-$arch\bin\Release"
            $dll = "$bin\LANCommander.Interposer.dll"

            Copy-Item $dll "$archDir\"
            Copy-Item "$bin\LANCommander.Interposer.Injector.exe" "$archDir\"

            foreach ($name in $loaderNames) {
              Copy-Item $dll (Join-Path $archDir $name)
            }

            # Shipped but not enabled: plugins only load from .interposer\Plugins\,
            # so the user has to opt in by moving one there. Listed explicitly
            # rather than globbed — Plugin.Example is a template for plugin
            # authors and must not end up in a release.
            New-Item -ItemType Directory -Force "$archDir\Plugins" | Out-Null

            foreach ($plugin in @('CDKey', 'Mouse')) {
              $source = "$bin\Plugins\LANCommander.Interposer.Plugin.$plugin.dll"

              if (-not (Test-Path -LiteralPath $source)) { throw "Missing plugin build: $source" }

              Copy-Item $source "$archDir\Plugins\"
            }

            Copy-Item -Recurse $sampleDir "$archDir\"
          }

          # The SDK a game patch links against: one header, and the import
          # library the DLL link produced for each architecture. It carries only
          # the Interposer* API -- proxy.def marks the system-DLL exports PRIVATE.
          New-Item -ItemType Directory -Force "$d\SDK\include" | Out-Null
          Copy-Item 'LANCommander.Interposer\include\LANCommander.Interposer.h' "$d\SDK\include\"

          foreach ($arch in @('x64', 'x86')) {
            $source = "out\windows-$arch\lib\Release\LANCommander.Interposer.lib"

            if (-not (Test-Path -LiteralPath $source)) { throw "Missing import library: $source" }

            New-Item -ItemType Directory -Force "$d\SDK\lib\$arch" | Out-Null
            Copy-Item $source "$d\SDK\lib\$arch\"
          }

          (Get-Content 'packaging\README.md' -Raw) -replace '\{VersionTag\}', $version |
            Set-Content "$d\README.md" -Encoding UTF8NoBOM

          Compress-Archive -Path "$d\*" -DestinationPath "LANCommander.Interposer.$version.zip"

          # Guard the layout the README documents.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zf = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "LANCommander.Interposer.$version.zip").Path)
          $names = @($zf.Entries | ForEach-Object { $_.FullName })
          $zf.Dispose()

          $expected = @('README.md', 'SDK/include/LANCommander.Interposer.h')
          foreach ($arch in @('x64', 'x86')) {
            $expected += "$arch/LANCommander.Interposer.dll"
            $expected += "$arch/LANCommander.Interposer.Injector.exe"
            $expected += "$arch/Plugins/LANCommander.Interposer.Plugin.CDKey.dll"
            $expected += "$arch/Plugins/LANCommander.Interposer.Plugin.Mouse.dll"
            $expected += "$arch/.interposer/Config.yml"
            $expected += "SDK/lib/$arch/LANCommander.Interposer.lib"
            foreach ($name in $loaderNames) { $expected += "$arch/$name" }
          }

          $missing = $expected | Where-Object { $names -notcontains $_ }
          if ($missing) { throw "Release ZIP is missing expected entries: $($missing -join ', ')" }

          Write-Host "Release ZIP entries: $($names.Count)"

      - name: Create redistributable payload ZIP
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'

          # One DLL per architecture. It serves every load method, so the
          # install script copies it out under whichever name Loader.Method
          # calls for and renders .interposer\Config.yml itself — no sample
          # config and no per-method duplicates are included. The injector
          # ships per architecture too: the Injector load method installs it
          # next to the game DLL, and it has to match the game's bitness.
          $d = 'pkg\redistributable'

          foreach ($arch in @('x64', 'x86')) {
            New-Item -ItemType Directory -Force "$d\$arch" | Out-Null
            Copy-Item "out\windows-$arch\bin\Release\LANCommander.Interposer.dll"          "$d\$arch\"
            Copy-Item "out\windows-$arch\bin\Release\LANCommander.Interposer.Injector.exe" "$d\$arch\"
          }

          Compress-Archive -Path "$d\*" -DestinationPath "LANCommander.Interposer.Redistributable.$version.zip"

      - name: Create LCX package
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $version   = '${{ github.ref_name }}'
          $buildDate = (Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')
          $redistDir = 'LANCommander.Interposer.Redistributable'
          $zipPath   = "LANCommander.Interposer.Redistributable.$version.zip"
          $outPath   = "LANCommander.Interposer.$version.lcx"

          $archiveGuid   = [guid]::NewGuid().ToString()
          $objectKeyGuid = [guid]::NewGuid().ToString()

          # Measure sizes
          $compressedSize   = (Get-Item $zipPath).Length
          $uncompressedSize = 0
          $zf = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath).Path)
          foreach ($e in $zf.Entries) { $uncompressedSize += $e.Length }
          $zf.Dispose()

          # Substitute variables in Manifest.yml
          $manifest = (Get-Content "$redistDir\Manifest.yml" -Raw) `
            -replace '\{BuildDate\}',       $buildDate `
            -replace '\{ArchiveGUID\}',      $archiveGuid `
            -replace '\{ObjectKeyGUID\}',    $objectKeyGuid `
            -replace '\{VersionTag\}',       $version `
            -replace '\{CompressedSize\}',   $compressedSize `
            -replace '\{UncompressedSize\}', $uncompressedSize

          # LANCommander's importer looks up Archives/<Archive.Id> and
          # Scripts/<Script.Id> -- bare GUIDs, no file extension. Anything else
          # imports as an empty script or a missing archive.
          $tmp = 'lcx_tmp'
          New-Item -ItemType Directory -Force "$tmp\Archives" | Out-Null
          New-Item -ItemType Directory -Force "$tmp\Scripts"  | Out-Null

          Set-Content "$tmp\Manifest.yml" $manifest -Encoding UTF8NoBOM

          $scripts = Get-ChildItem "$redistDir\Scripts" -Filter '*.ps1'
          $scripts | ForEach-Object { Copy-Item $_.FullName "$tmp\Scripts\$($_.BaseName)" }

          Copy-Item $zipPath "$tmp\Archives\$archiveGuid"

          Compress-Archive -Path "$tmp\*" -DestinationPath $outPath
          Remove-Item -Recurse -Force $tmp

          # Guard against the layout drifting again
          $expected = @('Manifest.yml', "Archives/$archiveGuid") + ($scripts | ForEach-Object { "Scripts/$($_.BaseName)" })
          $zf = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $outPath).Path)
          $names = @($zf.Entries | ForEach-Object { $_.FullName })
          $zf.Dispose()

          $missing = $expected | Where-Object { $names -notcontains $_ }
          if ($missing) { throw "LCX is missing expected entries: $($missing -join ', ')" }

          Write-Host "LCX entries: $($names -join ', ')"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            LANCommander.Interposer.${{ github.ref_name }}.zip
            LANCommander.Interposer.${{ github.ref_name }}.lcx
